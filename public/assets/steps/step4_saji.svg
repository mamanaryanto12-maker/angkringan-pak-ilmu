<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <radialGradient id="teaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
  </defs>
  <!-- Background bulat -->
  <circle cx="60" cy="50" r="44" fill="#FBF5EA" stroke="#D9C7AC" stroke-width="2"/>
  <!-- Meja angkringan kayu jati -->
  <path d="M22,78 L98,78" stroke="#8D5524" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Tatakan piring blirik kecil -->
  <ellipse cx="60" cy="74" rx="26" ry="6" fill="#F5F5F0" stroke="#246360" stroke-width="1.8"/>
  <ellipse cx="60" cy="74" rx="22" ry="4.5" fill="#E0F2F1"/>
  
  <!-- Cangkir kaleng blirik hijau loreng -->
  <rect x="46" y="50" width="28" height="24" rx="3" fill="#358C88" stroke="#1B4D4B" stroke-width="2"/>
  <!-- Pola loreng blirik putih-krem -->
  <path d="M48,54 Q54,58 50,66" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M64,52 Q70,58 66,68" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M56,60 Q60,66 56,72" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Gagang cangkir blirik -->
  <path d="M74,54 C82,54 82,68 74,68" stroke="#1B4D4B" stroke-width="3" fill="none"/>
  
  <!-- Seduhan wedang hangat kemerahan di bibir cangkir -->
  <ellipse cx="60" cy="50" rx="14" ry="4.5" fill="url(#teaGlow)" stroke="#A03B0D" stroke-width="1.2"/>
  
  <!-- Tangan santun menyajikan di sisi kanan dan kiri -->
  <path d="M30,68 C34,60 42,66 44,70" stroke="#D7A175" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M90,68 C86,60 78,66 76,70" stroke="#D7A175" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Kepulan uap wangi menari ke atas -->
  <path d="M52,44 Q56,36 50,30 Q54,24 50,18" stroke="#EE7217" stroke-width="1.8" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M60,42 Q66,34 60,26 Q66,18 62,12" stroke="#EE7217" stroke-width="2" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M68,44 Q72,36 68,30 Q74,24 70,18" stroke="#EE7217" stroke-width="1.8" fill="none" opacity="0.8" stroke-linecap="round"/>
</svg>
