<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="parchmentBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#EEDCB8"/>
    </linearGradient>
  </defs>
  <!-- Background lembaran tengah -->
  <rect x="15" y="16" width="70" height="62" rx="4" fill="url(#parchmentBody)" stroke="#8A6B3D" stroke-width="2"/>
  <!-- Ikon cobek dan rimpang simbol peracikan inti -->
  <ellipse cx="50" cy="38" rx="16" ry="8" fill="#55595D" stroke="#2D3033" stroke-width="1.5"/>
  <ellipse cx="50" cy="36" rx="12" ry="5" fill="#3D4043"/>
  <circle cx="46" cy="36" r="2.5" fill="#E8B34D"/>
  <circle cx="53" cy="37" r="2" fill="#7BA84C"/>
  <path d="M54,26 L58,35" stroke="#3D4043" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Baris teks formula resep -->
  <rect x="25" y="52" width="50" height="4" rx="2" fill="#8A6B3D" opacity="0.65"/>
  <rect x="25" y="60" width="46" height="4" rx="2" fill="#8A6B3D" opacity="0.5"/>
  <rect x="25" y="68" width="50" height="4" rx="2" fill="#8A6B3D" opacity="0.4"/>
  <!-- Penanda label Bagian Isi -->
  <rect x="32" y="82" width="36" height="14" rx="7" fill="#EE7217"/>
  <text x="50" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">ISI RESEP</text>
</svg>
