<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clothSock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="40%" stop-color="#EBE0CC"/>
      <stop offset="85%" stop-color="#D1BFA0"/>
      <stop offset="100%" stop-color="#A89474"/>
    </linearGradient>
    <linearGradient id="wireRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C9194"/>
      <stop offset="50%" stop-color="#D6DADF"/>
      <stop offset="100%" stop-color="#6E7377"/>
    </linearGradient>
    <linearGradient id="woodGrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A6642E"/>
      <stop offset="100%" stop-color="#6B3A11"/>
    </linearGradient>
  </defs>
  <!-- Bayangan -->
  <ellipse cx="50" cy="88" rx="28" ry="6" fill="#2C221E" opacity="0.18"/>
  
  <!-- Kantung Kain Saringan Melengkung Lembut -->
  <path d="M26,35 C24,55 34,78 48,84 C56,78 68,55 66,35 Z" 
        fill="url(#clothSock)" stroke="#8A7555" stroke-width="2" stroke-linejoin="round"/>
        
  <!-- Tekstur Lipatan Kain -->
  <path d="M36,36 Q38,58 48,82" stroke="#B39F7E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M54,36 Q52,58 48,82" stroke="#B39F7E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M44,45 Q48,60 48,76" stroke="#9E8A69" stroke-width="1.2" fill="none"/>
  
  <!-- Cincin Kawat Mulut Saringan -->
  <ellipse cx="46" cy="34" rx="22" ry="7" fill="#B09B79" stroke="url(#wireRing)" stroke-width="3"/>
  <ellipse cx="46" cy="34" rx="19" ry="5.5" fill="#422915" opacity="0.85"/>
  
  <!-- Tangkai Kawat & Pegangan Kayu -->
  <path d="M68,34 L88,34" stroke="url(#wireRing)" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="74" y="30.5" width="20" height="7" rx="3.5" fill="url(#woodGrip)" stroke="#4A2608" stroke-width="1.5"/>
</svg>
