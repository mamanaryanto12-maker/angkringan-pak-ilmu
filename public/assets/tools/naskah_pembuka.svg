<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="parchmentHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#EEDCB8"/>
    </linearGradient>
  </defs>
  <!-- Background gulungan kertas atas -->
  <path d="M15,20 C15,14 85,14 85,20 L85,75 C85,82 15,82 15,75 Z" fill="url(#parchmentHeader)" stroke="#8A6B3D" stroke-width="2"/>
  <!-- Gulungan atas berputar -->
  <ellipse cx="50" cy="20" rx="35" ry="6" fill="#F4E6CD" stroke="#8A6B3D" stroke-width="2"/>
  <!-- Simbol salam pembuka (aksara kearifan / ornamen bunga wijayakusuma minimalis) -->
  <circle cx="50" cy="38" r="8" fill="#EE7217" opacity="0.2"/>
  <path d="M50,32 C54,36 54,40 50,44 C46,40 46,36 50,32 Z" fill="#EE7217"/>
  <path d="M44,38 C48,34 52,34 56,38 C52,42 48,42 44,38 Z" fill="#EE7217"/>
  <!-- Baris tulisan kuno awal naskah -->
  <rect x="28" y="52" width="44" height="4" rx="2" fill="#8A6B3D" opacity="0.65"/>
  <rect x="24" y="60" width="52" height="4" rx="2" fill="#8A6B3D" opacity="0.5"/>
  <rect x="32" y="68" width="36" height="4" rx="2" fill="#8A6B3D" opacity="0.35"/>
  <!-- Penanda label Bagian Pembuka -->
  <rect x="26" y="82" width="48" height="14" rx="7" fill="#358C88"/>
  <text x="50" y="92" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">PEMBUKA</text>
</svg>
