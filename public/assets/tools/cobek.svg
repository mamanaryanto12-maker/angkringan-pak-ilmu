<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="stoneBase" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7D8287"/>
      <stop offset="60%" stop-color="#4F5357"/>
      <stop offset="100%" stop-color="#2D3033"/>
    </radialGradient>
    <radialGradient id="stoneHollow" cx="48%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2A2C2E"/>
      <stop offset="70%" stop-color="#3D4043"/>
      <stop offset="100%" stop-color="#5C6064"/>
    </radialGradient>
    <linearGradient id="pestleStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C9196"/>
      <stop offset="50%" stop-color="#55595D"/>
      <stop offset="100%" stop-color="#282A2B"/>
    </linearGradient>
  </defs>
  <!-- Bayangan Dasar -->
  <ellipse cx="50" cy="85" rx="42" ry="9" fill="#1C1816" opacity="0.25"/>
  
  <!-- Badan Cobek Batu -->
  <ellipse cx="50" cy="62" rx="42" ry="24" fill="url(#stoneBase)" stroke="#232526" stroke-width="2.5"/>
  <path d="M8,62 C8,76 26,86 50,86 C74,86 92,76 92,62 Z" fill="#383B3D" stroke="#232526" stroke-width="2.5"/>
  
  <!-- Cekungan Dalam Cobek -->
  <ellipse cx="50" cy="60" rx="35" ry="18" fill="url(#stoneHollow)" stroke="#1F2122" stroke-width="2"/>
  
  <!-- Bintik Tekstur Pori Batu Alami -->
  <circle cx="34" cy="58" r="1.5" fill="#8E9398" opacity="0.5"/>
  <circle cx="62" cy="64" r="1.2" fill="#8E9398" opacity="0.5"/>
  <circle cx="48" cy="68" r="1.5" fill="#8E9398" opacity="0.4"/>
  <circle cx="28" cy="65" r="1.3" fill="#8E9398" opacity="0.4"/>
  
  <!-- Ulekan / Munthu Menumpuk Miring -->
  <path d="M40,24 C44,20 52,22 56,28 L64,48 C66,54 62,60 54,62 C46,64 40,58 38,52 L36,32 C35,27 37,25 40,24 Z" 
        fill="url(#pestleStone)" stroke="#1D1F20" stroke-width="2.2" transform="rotate(22 50 42)"/>
  <ellipse cx="60" cy="52" rx="7" ry="5" fill="#252729" transform="rotate(22 60 52)"/>
</svg>
